<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Super System Studio</title>
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="./components.css" />
  </head>
  <body>
    <p id="demo-banner" class="demo-banner" hidden></p>
    <header>
      <h1>Super System <span style="color: #64748b; font-weight: 500">Studio</span></h1>
      <div class="actions">
        <span id="status"></span>
        <button class="theme-toggle" id="toggle" type="button">Dark preview</button>
        <button class="save" id="save" type="button">Save theme</button>
      </div>
    </header>
    <main>
      <aside>
        <h2>Brand</h2>
        <label>Primary color<input id="primary" type="color" /></label>
        <label>Primary text<input id="primaryForeground" type="color" /></label>
        <div class="row">
          <label>Background<input id="background" type="color" /></label>
          <label>Text<input id="foreground" type="color" /></label>
        </div>
        <div class="row">
          <label>Secondary<input id="secondary" type="color" /></label>
          <label>Secondary text<input id="secondaryForeground" type="color" /></label>
        </div>
        <h2>Typography and shape</h2>
        <label>Font family<input id="fontSans" /></label>
        <div class="row">
          <label>Base size<input id="baseSize" /></label>
          <label>Medium radius<input id="radiusMd" /></label>
        </div>
        <div class="row">
          <label
            >Density<select id="density">
              <option>compact</option>
              <option>comfortable</option>
              <option>spacious</option>
            </select></label
          >
          <label
            >Icon library<select id="icons">
              <option>lucide</option>
              <option>phosphor</option>
              <option>heroicons</option>
              <option>custom</option>
            </select></label
          >
        </div>
        <h2>Accessibility</h2>
        <div class="row">
          <label
            >Contrast<select id="contrast">
              <option>AA</option>
              <option>AAA</option>
            </select></label
          >
          <label>Minimum target<input id="target" type="number" min="24" max="64" /></label>
        </div>
      </aside>
      <section class="preview">
        <article class="ss-card preview-theme" id="preview-root" data-theme="light">
          <span class="ss-badge ss-badge--primary">Super powered</span>
          <h3 class="preview-title">Create your account</h3>
          <p class="preview-lead">
            Every component follows the same theme, spacing, and accessibility rules.
          </p>

          <section class="preview-section">
            <h4 class="preview-label">Button</h4>
            <div class="demo-row">
              <button class="ss-button ss-button--primary ss-button--md" type="button">Primary</button>
              <button class="ss-button ss-button--secondary ss-button--md" type="button">Secondary</button>
              <button class="ss-button ss-button--destructive ss-button--md" type="button">Delete</button>
              <button class="ss-button ss-button--ghost ss-button--md" type="button">Learn more</button>
            </div>
            <div class="demo-row">
              <button class="ss-button ss-button--primary ss-button--sm" type="button">Small</button>
              <button class="ss-button ss-button--primary ss-button--md" type="button">Medium</button>
              <button class="ss-button ss-button--primary ss-button--lg" type="button">Large</button>
              <button class="ss-button ss-button--primary ss-button--md" type="button" disabled aria-busy="true">
                <span class="ss-spinner" aria-hidden="true"></span>
                <span>Saving</span>
              </button>
            </div>
          </section>

          <section class="preview-section">
            <h4 class="preview-label">Label</h4>
            <label class="ss-label" for="preview-email">Email address</label>
            <label class="ss-label" for="preview-name">
              Full name <span class="ss-label__required" aria-hidden="true"> *</span>
            </label>
            <label class="ss-label ss-label--disabled" for="preview-disabled">Disabled field</label>
          </section>

          <section class="preview-section">
            <h4 class="preview-label">Input</h4>
            <label class="ss-label">
              Email address
              <input class="ss-input" type="email" placeholder="you@example.com" />
            </label>
            <label class="ss-label">
              Invalid field
              <input
                class="ss-input ss-input--invalid"
                type="text"
                aria-invalid="true"
                value="Bad value"
              />
            </label>
          </section>

          <section class="preview-section">
            <h4 class="preview-label">Textarea</h4>
            <label class="ss-label">
              Bio
              <textarea class="ss-textarea" placeholder="Tell us about yourself"></textarea>
            </label>
            <label class="ss-label">
              Invalid message
              <textarea class="ss-textarea ss-textarea--invalid" aria-invalid="true">Too short</textarea>
            </label>
          </section>

          <section class="preview-section">
            <h4 class="preview-label">Badge</h4>
            <div class="demo-row">
              <span class="ss-badge ss-badge--neutral">Draft</span>
              <span class="ss-badge ss-badge--primary">Active</span>
              <span class="ss-badge ss-badge--destructive">Blocked</span>
            </div>
          </section>

          <div id="checks"></div>
        </article>
      </section>
    </main>
    <script type="module" src="./app.js"></script>
  </body>
</html>
