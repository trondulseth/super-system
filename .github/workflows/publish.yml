name: Publish beta

on:
  workflow_dispatch:
  push:
    tags:
      - "v0.1.0-beta.*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: npm publish --workspace=@super-system/tokens --tag beta
      - run: npm publish --workspace=@super-system/react --tag beta
      - run: npm publish --workspace=@super-system/cli --tag beta
